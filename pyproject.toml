[project]
name = "jobbot"
version = "0.1.0"
description = "Autonomous job search, application and tracking bot"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.13",
    "playwright>=1.50",
    "sqlalchemy>=2.0",
    "typer>=0.12",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "cryptography>=42",
    "google-api-python-client>=2.100",
    "google-auth-oauthlib>=1.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "respx>=0.21"]

[project.scripts]
jobbot = "jobbot.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["jobbot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
